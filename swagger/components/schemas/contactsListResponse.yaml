type: object
properties:
  message:
    type: string
  status:
    type: integer
  data:
    type: object
    properties:
      data:
        type: array
        items:
          $ref: ./contact.yaml
      paginationData:
        type: object
        properties:
          page:
            type: integer
          perPage:
            type: integer
          totalItems:
            type: integer
          totalPages:
            type: integer
required:
  - message
  - status
  - data
